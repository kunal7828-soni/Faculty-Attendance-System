workflows:
  ios-workflow:
    name: iOS Workflow

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    triggering:
      events:
        - push

    scripts:
      - flutter clean
      - flutter pub get
      - flutter build apk --release
      - flutter build ipa --release --no-codesign

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - kunalsonisankal@gmail.com