workflows:
  ios-workflow:
    name: iOS IPA Build

    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - flutter clean
      - flutter pub get
      - flutter build ios --release --no-codesign

      # Create Payload folder
      - mkdir -p Payload

      # Copy Runner.app into Payload
      - cp -R build/ios/iphoneos/Runner.app Payload/

      # Create real IPA
      - zip -r Runner.ipa Payload

    artifacts:
      - Runner.ipa